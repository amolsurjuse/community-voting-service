spring:
  application:
    name: community-voting-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/community_voting}
    username: ${DATABASE_USERNAME:community_voting}
    password: ${DATABASE_PASSWORD:community_voting}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
voting:
  receipt-token-key: ${RECEIPT_TOKEN_KEY}
