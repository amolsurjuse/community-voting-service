services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: community_voting
      POSTGRES_USER: community_voting
      POSTGRES_PASSWORD: community_voting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_voting"]
      interval: 2s
      timeout: 2s
      retries: 20
