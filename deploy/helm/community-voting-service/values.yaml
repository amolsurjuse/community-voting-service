replicaCount: 2
environment: dev
image:
  repository: ghcr.io/example/community-voting-service
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
service:
  port: 8080
auth:
  issuer: auth-service
  existingSecret: community-voting-auth
  secretKey: jwt-secret
database:
  existingSecret: community-voting-database
  urlKey: url
  usernameKey: username
  passwordKey: password
receiptToken:
  existingSecret: community-voting-crypto
  secretKey: receipt-token-key
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
