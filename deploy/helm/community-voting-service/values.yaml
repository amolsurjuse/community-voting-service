replicaCount: 2
environment: dev
image:
  repository: ghcr.io/example/community-voting-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 80
auth:
  issuer: auth-service
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
