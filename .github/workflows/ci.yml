name: Backend CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify database invariants and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: community-voting-service
          path: target/community-voting-service-*.jar
          if-no-files-found: error
