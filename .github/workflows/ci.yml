name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pulsevote_test
          POSTGRES_USER: pulsevote
          POSTGRES_PASSWORD: pulsevote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsevote"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/pulsevote_test
      TEST_DATABASE_USERNAME: pulsevote
      TEST_DATABASE_PASSWORD: pulsevote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify database invariants and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: community-voting-service
          path: target/community-voting-service-*.jar
          if-no-files-found: error

