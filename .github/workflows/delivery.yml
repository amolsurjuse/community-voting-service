name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package without bypassing compilation
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/community-voting-service:${{ github.sha }}
          provenance: true
          sbom: true

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy immutable image
        run: >-
          helm upgrade --install community-voting-service deploy/helm/community-voting-service
          --namespace community-voting-${{ inputs.environment }} --create-namespace
          --set image.repository=ghcr.io/${{ github.repository_owner }}/community-voting-service
          --set image.tag=${{ github.sha }}
          --set environment=${{ inputs.environment }}
          --wait --atomic --timeout 5m
      - name: Verify rollout
        run: kubectl -n community-voting-${{ inputs.environment }} rollout status deployment/community-voting-service --timeout=180s

