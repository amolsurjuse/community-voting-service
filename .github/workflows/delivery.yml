name: Production delivery

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package without bypassing compilation
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/community-voting-service:${{ github.sha }}
          provenance: true
          sbom: true

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: community-voting-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate production deployment configuration
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG_DATA is not configured in the prod environment."
            exit 1
          fi
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error::GHCR_PULL_TOKEN is not configured in the prod environment."
            exit 1
          fi
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          if ! printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"; then
            echo "::error::KUBE_CONFIG_DATA is not valid base64."
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info --request-timeout=15s
      - name: Configure production registry credentials
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl -n prod create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy immutable image
        run: >-
          helm upgrade --install community-voting-service deploy/helm/community-voting-service
          --namespace prod --create-namespace
          --set image.repository=ghcr.io/${{ github.repository_owner }}/community-voting-service
          --set image.tag=${{ github.sha }}
          --set imagePullSecrets[0].name=ghcr-pull
          --set environment=prod
          --set auth.existingSecret=auth-jwt-prod-secret
          --set auth.secretKey=APP_SECURITY_JWT_SECRET
          --wait --rollback-on-failure --timeout 5m
      - name: Verify rollout
        run: kubectl -n prod rollout status deployment/community-voting-service --timeout=180s
